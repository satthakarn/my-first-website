<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My First Vercel Website</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(59, 130, 246, 0.35), transparent 30%),
        radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.35), transparent 30%),
        linear-gradient(135deg, #0f172a, #111827, #020617);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 60px 40px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.35);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: #86efac;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 14px rgba(34, 197, 94, 0.8);
    }

    h1 {
      font-size: clamp(2.6rem, 7vw, 5.5rem);
      line-height: 1.05;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #ffffff, #bfdbfe, #ddd6fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: #cbd5e1;
      max-width: 650px;
      margin: 0 auto 34px;
      line-height: 1.7;
    }

    .highlight {
      color: #93c5fd;
      font-weight: 700;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-top: 24px;
    }

    .btn {
      text-decoration: none;
      padding: 13px 22px;
      border-radius: 12px;
      font-weight: 700;
      transition: 0.25s ease;
      display: inline-block;
    }

    .btn-primary {
      background: white;
      color: #0f172a;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(255, 255, 255, 0.18);
    }

    .btn-secondary {
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      background: rgba(255, 255, 255, 0.06);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 28px;
      font-size: 14px;
      color: #94a3b8;
    }

    .footer span {
      color: #e2e8f0;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      .card {
        padding: 40px 24px;
      }

      .actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">

      <div class="badge">
        <span class="status-dot"></span>
        Live Deployment Successful
      </div>

      <h1>Hello, Vercel 👋</h1>

      <p class="subtitle">
        This is my first website deployed using
        <span class="highlight">GitHub</span> and
        <span class="highlight">Vercel</span>.
        The project demonstrates a simple cloud deployment workflow
        from source code to a live website.
      </p>

      <div class="actions">
        <a class="btn btn-primary" href="https://vercel.com" target="_blank">
          View Vercel
        </a>

        <a class="btn btn-secondary" href="https://github.com" target="_blank">
          View GitHub
        </a>
      </div>

      <div class="footer">
        ITMD515 • Hospital IT Infrastructure<br />
        <span>GitHub + Vercel Deployment Workshop</span>
      </div>

    </div>
  </div>
</body>
</html>
